#####################################################################
#   Extras — host-side only, safe to enable with no toolhead fitted
#####################################################################
#
# Nothing here touches MCU config, so enabling it does not force an MCU
# reconfigure. All of it works today, toolhead or not.

#####################################################################
#   Chamber lighting
#####################################################################
# [output_pin daylight] is defined in printer.cfg on PC8 with pwm: True, so it
# dims rather than just switching. The LCD menu already drives it with a bare
# SET_PIN on/off; these give the same thing a name, a remembered brightness,
# and buttons in Mainsail.

[gcode_macro _LIGHTS_VARS]
description: Settings for the chamber light macros
variable_brightness: 1.0        # 0.0 - 1.0, used by LIGHTS_ON with no argument
gcode:
    # Storage only. Change the default with:
    #   SET_GCODE_VARIABLE MACRO=_LIGHTS_VARS VARIABLE=brightness VALUE=0.4
    {action_respond_info("brightness = %.2f" % printer["gcode_macro _LIGHTS_VARS"].brightness)}

[gcode_macro LIGHTS_ON]
description: Chamber lights on. LIGHTS_ON S=0.4 for a specific brightness
gcode:
    {% set s = params.S|default(printer["gcode_macro _LIGHTS_VARS"].brightness)|float %}
    {% set s = [[s, 0.0]|max, 1.0]|min %}
    SET_PIN PIN=daylight VALUE={s}
    {action_respond_info("lights on at %.0f%%" % (s * 100))}

[gcode_macro LIGHTS_OFF]
description: Chamber lights off
gcode:
    SET_PIN PIN=daylight VALUE=0
    {action_respond_info("lights off")}

[gcode_macro LIGHTS_TOGGLE]
description: Toggle the chamber lights
gcode:
    {% if printer["output_pin daylight"].value > 0 %}
        LIGHTS_OFF
    {% else %}
        LIGHTS_ON
    {% endif %}

#####################################################################
#   Host temperature
#####################################################################
# The Pi's own SoC temperature, alongside the existing Board_MCU sensor. Free,
# and worth having in an office that gets warm.

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 85

#####################################################################
#   G2/G3 arc support
#####################################################################
# Lets a slicer emit real arcs instead of thousands of tiny line segments.
# Smaller gcode, smoother curves, less chance of starving the motion queue.

[gcode_arcs]
resolution: 0.1

#####################################################################
#   Firmware retraction
#####################################################################
# Defines G10/G11 so retraction can be tuned live with SET_RETRACTION instead
# of re-slicing. The numbers below are placeholder defaults for a direct drive
# extruder — tune them once the Nitehawk and Revo are on and you can actually
# print. Harmless until then.

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35
