#####################################################################
#  STARSCREAM DISPLAY v2
#  FYSETC Mini 12864 / Klipper
#
#  Upload to:
#      ~/printer_data/config/display_starscream.cfg
#
#  Include it:
#      [include display_starscream.cfg]
#
#  In your existing [display] section:
#      display_group: starscream
#####################################################################

#####################################################################
#  DECEPTICON GLYPH - sharper v2
#####################################################################

[display_glyph decepticon]
data:
    ....**....**....
    ...****..****...
    ..************..
    .***..****..***.
    ***...****...***
    **....****....**
    .**..******..**.
    ..************..
    ...***.**.***...
    ..***..**..***..
    .***...**...***.
    .**...****...**.
    ..**.******.**..
    ...**********...
    ....**....**....
    .....**..**.....

#####################################################################
#  STARSCREAM STATUS SCREEN
#
#  128x64 display / 4 text rows
#  Logo occupies rows 0-1, columns 0-1.
#####################################################################

[display_data starscream logo]
position: 0,0
text:
    ~decepticon~

[display_data starscream name]
position: 0,2
text:
    STARSCREAM

[display_data starscream temperatures]
position: 1,2
text:
    {% if 'extruder' in printer %}
      E:{ "%3.0f" % printer.extruder.temperature }/{ "%3.0f" % printer.extruder.target } B:{ "%3.0f" % printer.heater_bed.temperature }/{ "%3.0f" % printer.heater_bed.target }
    {% else %}
      E:---/--- B:{ "%3.0f" % printer.heater_bed.temperature }/{ "%3.0f" % printer.heater_bed.target }
    {% endif %}

[display_data starscream position]
position: 2,0
text:
    {% set p = printer.toolhead.position %}
    X:{ "%3.0f" % p.x } Y:{ "%3.0f" % p.y } Z:{ "%4.1f" % p.z }

[display_data starscream status]
position: 3,0
text:
    {% if printer.print_stats.state == "printing" %}
      PRINT { "%3.0f" % (printer.virtual_sdcard.progress * 100.0) }% { printer.print_stats.filename[:9] }
    {% elif printer.print_stats.state == "paused" %}
      PAUSED
    {% elif printer.print_stats.state == "error" %}
      ERROR
    {% elif printer.idle_timeout.state == "Printing" %}
      PRINTING
    {% else %}
      { printer.idle_timeout.state }
    {% endif %}

#####################################################################
#  OPTIONAL DISPLAY MESSAGE MACRO
#####################################################################

[gcode_macro STARSCREAM_ONLINE]
description: Display Starscream online message
gcode:
    M117 STARSCREAM ONLINE
