#####################################################################
#   LDO Nitehawk-SB toolboard + E3D Revo Voron PZ Probe
#####################################################################
#
# Pin map from https://docs.ldomotors.com/en/Toolboard/nitehawk-sb
# and LDO's own partial config at MotorDynamicsLab/Nitehawk-SB.
#
# The Nitehawk is an RP2040 on USB (not CAN), so it appears as a second
# [mcu] over /dev/serial/by-id. Firmware: RP2040, 16KiB bootloader offset
# (Katapult), USB. See the LDO docs for the make menuconfig settings.
#
# This file is included at the END of printer.cfg so its pin assignments win.
#
#####################################################################
#   READ THIS BEFORE APPLYING POWER
#####################################################################
#
# 1. THE MCU SERIAL BELOW IS A PLACEHOLDER. Run
#        ls /dev/serial/by-id/
#    and paste the real usb-Klipper_rp2040_* path in.
#
# 2. THE PZ GOES ON THE "IO PORT" PADS, NOT THE NEOPIXEL OR ENDSTOP PORT.
#    From LDO's own pinout diagram, the 2.54mm IO Port pad header carries:
#        GND | 3V3 | FS (gpio3) | SU (gpio2)
#    That is the only 3.3V on the board, and it sits on the same 4-pad header as
#    two free GPIOs. So power and signal both come from there:
#        PZ GND     -> IO Port GND
#        PZ PWR     -> IO Port 3V3
#        PZ Trigger -> IO Port FS  (gpio3)
#
#    Why not the other ports:
#      * Neopixel (fan adapter) is 5V/GND/DATA
#      * XY Endstop (JST-XH 4P) is GND | X gpio13 | Y gpio12 | 5V
#      * PROBE (JST-XH 3P) is GND | ABL gpio10 | 24V
#    All of them would power the PZ at 5V or 24V. The PZ's Trigger idles at
#    whatever it is powered from, and RP2040 GPIO is NOT 5V tolerant - so a 5V
#    supply means 5V into a 3.3V input. The 3V3 pad avoids the whole problem
#    without a divider or a level shifter.
#
# 3. gpio2 (SU) is the spare if gpio3 is awkward to reach. gpio13 also still
#    works as a trigger input if you would rather use the endstop connector -
#    but take POWER from the 3V3 pad either way, never from that port's 5V pin.
#
# 4. VERIFY POLARITY BEFORE HOMING Z. With the toolhead parked in mid-air,
#        QUERY_PROBE
#    must report "open". Tap the nozzle by hand and it must report
#    "TRIGGERED". If those are backwards, remove the '!' from the probe pin.
#
#####################################################################

[mcu nhk]
##  Obtain with: ls -l /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Klipper_rp2040_REPLACE_ME-if00
restart_method: command

#####################################################################
#   Extruder
#####################################################################
# Mechanical values carried over from the [extruder] block that used to live
# commented out in printer.cfg (Clockwork 2 / BMG, 50:10). rotation_distance
# is worth re-running now that the extruder has been off the machine.
#
# The heater and sensor are NEW: E3D Revo Voron with the standard heater core
# and thermistor, replacing the PT100 + MAX31865 that the SB2209 carried. The
# Nitehawk has no MAX31865, and does not need one.

[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 23.5764
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.75

heater_pin: nhk:gpio9
##  Revo heater core thermistor. E3D ship a Semitec 104NT in the Revo cores;
##  confirm against your hotside pack before the first heat-up. If the reading
##  at room temperature is obviously wrong, this line is the reason.
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio29
##  REQUIRED: the Nitehawk's TH0 port uses a 2.2k pullup, not the usual 4.7k.
##  Leave this out and every temperature you read will be wrong.
pullup_resistor: 2200

min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_power: 1.0
pwm_cycle_time: 0.02
smooth_time: 0.5
max_extrude_cross_section: 0.8
max_extrude_only_distance: 101.9
instantaneous_corner_velocity: 1.5
##  No PID here on purpose. The old values (21.270 / 1.818 / 62.218) were tuned
##  against a PT100 in a different hotend and are meaningless for the Revo.
##  Run PID_CALIBRATE HEATER=extruder TARGET=245 and let SAVE_CONFIG write them.

[tmc2209 extruder]
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
sense_resistor: 0.100
interpolate: false
##  LDO recommend staying under 0.7A on this board without extra cooling.
run_current: 0.500
stealthchop_threshold: 0

#####################################################################
#   Probe - E3D Revo Voron PZ Probe
#####################################################################
# A piezo element that triggers on nozzle-to-bed contact, so:
#   * there is no X/Y offset - it probes with the nozzle itself
#   * there is no dock, which is what retired Klicky (see archive/)
#   * it doubles as the Z endstop, via probe:z_virtual_endstop in printer.cfg
#
# Trigger is ACTIVE LOW: idle high, pulled to 0V on contact. '!' inverts that
# into Klipper's "triggered = 1" convention; '^' is belt-and-braces in case the
# output is open-drain rather than push-pull.
#
# Landed on gpio3 - the "FS" pad on the IO Port header - because that header is
# the only place on the board with a 3.3V supply next to a free GPIO. Powering
# the PZ from any of the connectorised ports would put 5V or 24V on it, and its
# Trigger idles at its own supply rail.
[probe]
pin: ^!nhk:gpio3
x_offset: 0
y_offset: 0
##  Nozzle probe: the real offset is a nozzle-width of squish, not a sensor
##  standoff. Start at 0 and set it with PROBE_CALIBRATE.
z_offset: 0
speed: 5.0
##  E3D call for 5 mm/s. Faster deforms the piezo reading.
lift_speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

##  E3D ask for the Z motor current to be dropped to roughly 40% while probing,
##  so a mistrigger pushes the nozzle into the bed with far less force. Z is
##  three independent leadscrews on this machine, so it cannot fall while the
##  current is low.
##  Run_current is 0.7 in printer.cfg; 0.28 is 40% of that.
activate_gcode:
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.28
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.28
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.28
deactivate_gcode:
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.7
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.7
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.7

#####################################################################
#   Fans
#####################################################################
## Part cooling, via the fan adapter PCB.
[fan]
pin: nhk:gpio6
##  Uncomment if the part fan is a 3-pin tacho type.
#tachometer_pin: nhk:gpio17
#tachometer_ppr: 2

## Hotend fan, via the fan adapter PCB.
[heater_fan hotend_fan]
pin: nhk:gpio5
heater: extruder
heater_temp: 50
##  Uncomment if the hotend fan is a 3-pin tacho type.
#tachometer_pin: nhk:gpio16
#tachometer_ppr: 2

#####################################################################
#   Lights
#####################################################################
## Stealthburner headlights, via the fan adapter PCB.
[neopixel sb_leds]
pin: nhk:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.52
initial_GREEN: 0.07
initial_BLUE: 0.71
initial_WHITE: 0.0

## Small onboard status LED. Active low.
[output_pin act_led]
pin: !nhk:gpio8

#####################################################################
#   Accelerometer
#####################################################################
# Onboard ADXL345 - input shaping without bolting anything on.
#   SHAPER_CALIBRATE

[adxl345]
cs_pin: nhk:gpio21
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
##  300mm build, bed centre.
probe_points:
    150, 150, 20

#####################################################################
#   Thermistors
#####################################################################
## Chamber thermistor on the CT port. Replaces the [temperature_sensor chamber]
## that used to live in sb2209.cfg / sb2240.cfg.
[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: nhk:gpio28
min_temp: 0
max_temp: 100
gcode_id: chamber_th

## Onboard board-temperature sensor.
[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor nitehawk]
sensor_type: CMFB103F3950FANT
sensor_pin: nhk:gpio26
pullup_resistor: 2200
min_temp: 0
max_temp: 100
gcode_id: nh_th
