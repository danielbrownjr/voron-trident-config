#####################################################################
#   GET_IP - print every address this printer answers on
#####################################################################
#
# DISABLED ON PURPOSE. [gcode_shell_command] is NOT part of stock Klipper - it
# comes from KIAUH's "G-Code Shell Command" extension. Without it installed,
# Klipper refuses to start with:
#     Section 'gcode_shell_command get_ip' is not a valid config section
#
# To enable:
#   1. Install the extension - KIAUH -> [4] Advanced -> G-Code Shell Command
#   2. chmod +x ~/printer_data/config/scripts/get_ip.sh
#   3. Uncomment [include network.cfg] in printer.cfg
#   4. RESTART, then run GET_IP from the console
#
# Klipper itself has no networking awareness at all, so shelling out is the only
# way to answer this from the g-code console.
#
# This prints ALL interfaces on purpose. The printer is on an office LAN and
# reaches home over WireGuard, so it has more than one address and which one is
# useful depends on where you are asking from. The wg* address is the one to SSH
# to from the far end of the tunnel; the default-route one is office-local.
#
# If that is more machinery than the answer is worth: Mainsail's
# Machine -> System Info panel already lists every interface, and works through
# OctoEverywhere without any of this.

[gcode_shell_command get_ip]
command: /usr/bin/env bash /home/pi/printer_data/config/scripts/get_ip.sh
timeout: 5.
verbose: True

[gcode_macro GET_IP]
description: Print the printer's hostname and every interface address
gcode:
    RUN_SHELL_COMMAND CMD=get_ip
