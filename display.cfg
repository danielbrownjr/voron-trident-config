#####################################################################
#  STARSCREAM STATUS SCREEN
#
#  Logo: 32x32 pixels at upper-left.
#  Temperatures are intentionally compact so the bed temp does not
#  get chopped off.
#####################################################################

[display_data starscream logo_tl]
position: 0,0
text:
    ~decepticon_tl~

[display_data starscream logo_tr]
position: 0,2
text:
    ~decepticon_tr~

[display_data starscream logo_bl]
position: 1,0
text:
    ~decepticon_bl~

[display_data starscream logo_br]
position: 1,2
text:
    ~decepticon_br~

[display_data starscream name]
position: 0,4
text:
    STARSCREAM

[display_data starscream temperatures]
position: 1,4
text:
    {% if 'extruder' in printer %}
      E:{ "%3.0f" % printer.extruder.temperature } B:{ "%3.0f" % printer.heater_bed.temperature }
    {% else %}
      E:--- B:{ "%3.0f" % printer.heater_bed.temperature }
    {% endif %}

[display_data starscream position]
position: 2,0
text:
    {% set p = printer.toolhead.position %}
    X{ "%3.0f" % p.x } Y{ "%3.0f" % p.y } Z{ "%4.1f" % p.z }

[display_data starscream status]
position: 3,0
text:
    {% if printer.print_stats.state == "printing" %}
      PRINT { "%3.0f" % (printer.virtual_sdcard.progress * 100.0) }%
    {% elif printer.print_stats.state == "paused" %}
      PAUSED
    {% elif printer.print_stats.state == "error" %}
      ERROR
	{% else %}
  	  SEEKER ONLINE
	{% endif %}

#####################################################################
#  OPTIONAL MESSAGE MACRO
#####################################################################

[gcode_macro STARSCREAM_ONLINE]
description: Display Starscream online message
gcode:
    M117 STARSCREAM ONLINE
