[gcode_macro LOAD_FILAMENT]
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
        M83
        G92 E0
        G1 E50 F300
        G1 E15 F120
        G92 E0
    {% else %}
        RESPOND TYPE=error MSG="Extruder not hot enough"
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
        M83
        G92 E0
        G1 E5 F300
        G1 E-70 F900
        G92 E0
    {% else %}
        RESPOND TYPE=error MSG="Extruder not hot enough"
    {% endif %}